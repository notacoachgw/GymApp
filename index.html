<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Gym Log"><link rel="apple-touch-icon" href="icon-192.png"><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gym Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Three tabs (Workout, History, Progress) share a bottom nav; the logger, picker, forms and workout detail push over them; menus are bottom sheets. One dark look on purpose: gym lighting and OLED phones. */
:root{
  --bg:#101214;--surface:#181B1E;--raised:#202428;--line:#2C3136;--line-strong:#3A4147;
  --text:#ECEFF1;--muted:#A0A9B0;--accent:#FF7B2E;--on-accent:#101214;--done:#5CC8E8;--danger:#FF8577;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:400 16px/1.35 var(--body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.grow{flex:1;min-width:0}

/* headers */
.hdr{display:flex;align-items:center;gap:12px;padding:20px 16px 12px}
.hdr.tight{padding-top:16px}
.ttl{margin:0;font:700 44px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.ttl.sm{font-size:30px}
.meta{margin-top:4px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.title-input{width:100%;min-width:0;padding:0;background:none;border:0;border-radius:6px;font:700 26px/1.1 var(--display);text-transform:uppercase;text-overflow:ellipsis;color:var(--text)}
.hdr .btn-sm{padding:0 16px}
.awake{display:inline-flex;vertical-align:-2px;margin-left:2px;color:var(--accent)}
.title-input:focus-visible{outline-offset:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--raised);color:var(--text);font-weight:700;font-size:16px;text-decoration:none}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-ghost{background:none;color:var(--accent)}
.btn-danger{background:none;color:var(--danger)}
.btn-sm{min-height:44px;padding:0 20px}
.btn-block{width:100%}
.btn-xl{min-height:60px;padding:0 12px;font:700 22px var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.btn[disabled]{background:var(--raised);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.link{min-height:44px;padding:0 4px;background:none;border:0;color:var(--accent);font-weight:600;font-size:16px}
.iconbtn{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text)}
.iconbtn.plain{background:none;border-color:transparent;color:var(--muted)}

/* cards and lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.sec h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:20px 16px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--text);font:600 22px var(--display);margin-bottom:4px}
.rcard{display:flex;align-items:stretch}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;min-height:88px;padding:14px 4px 14px 16px;background:none;border:0;text-align:left;border-radius:12px}
.rname{font:600 26px/1.1 var(--display)}
.rsub{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .iconbtn{align-self:center;margin-right:6px}
.resume{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 16px;text-align:left;background:var(--accent);border:0;border-radius:10px;color:var(--on-accent)}
.resume .rname{font-size:26px}
.resume .rsub{color:var(--on-accent)}
.hist{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hrow .l{display:flex;align-items:center;gap:10px;min-width:0}
.hstat{display:flex;gap:16px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.hnames{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;letter-spacing:.06em}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat .v{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{margin-top:4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* logger cards */
.gcard{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:4px;margin-right:-8px}
.gtoggle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:0;background:none;border:0;text-align:left}
.gbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gname{font:600 24px/1.1 var(--display)}
.gname.open{color:var(--accent)}
.gsub{font-size:14px;color:var(--muted)}
.gchev{flex:none;color:var(--muted)}
.exlist{display:flex;flex-direction:column;gap:4px;padding:2px 0}
.exline{display:flex;align-items:center;gap:10px;min-height:28px}
.letter{flex:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--raised);color:var(--muted);font-size:13px;font-weight:700}
.sets{display:flex;flex-direction:column;gap:6px}
.grid,.shead{display:grid;grid-template-columns:36px minmax(0,1fr) 76px 64px 44px;gap:8px;align-items:center}
.shead{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.span2{grid-column:span 2}
.round-end{height:1px;margin:4px 0 2px;background:var(--line)}
.setno{height:44px;padding:0;background:none;border:0;border-radius:10px;font:600 22px var(--display);color:var(--muted)}
.setno.kind{color:var(--accent)}
.prev{text-align:center;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:100%;min-width:0;height:44px;padding:0 4px;text-align:center;background:var(--raised);border:1px solid var(--line);border-radius:10px;font:600 22px var(--display);font-variant-numeric:tabular-nums;color:var(--text)}
.num::placeholder{color:var(--muted);opacity:1}
.check{width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;color:var(--muted)}
.check.on{background:var(--done);border-color:var(--done);color:#101214}
.addset{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;background:var(--raised);border:0;border-radius:10px;font-weight:600;font-size:16px}

/* rest timer */
.rest{position:relative;display:flex;align-items:center;gap:10px;padding:12px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}
.rest .fill{position:absolute;left:0;top:-1px;height:3px;background:var(--accent)}
.rest .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rest .time{font:700 44px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.rest.over .time{color:var(--done)}
.rest .note{font-size:15px;color:var(--muted)}
.rbtn{min-width:56px;min-height:48px;padding:0 10px;background:var(--raised);border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:16px}
.rbtn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;padding:0 14px}

/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px 8px;background:var(--surface);border-top:1px solid var(--line)}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600}
.navbtn[aria-current=page]{color:var(--accent)}

/* chips and forms */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;min-height:44px;padding:0 18px;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--muted);font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chips.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;padding:0;gap:6px}
.chips.seg .chip{border-radius:10px;padding:0}
.field{display:flex;flex-direction:column;gap:8px}
.lab{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;min-height:52px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:17px;color:var(--text)}
.input::placeholder{color:var(--muted);opacity:1}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.search input{flex:1;min-width:0;height:44px;padding:0;background:none;border:0;font-size:16px;color:var(--text)}
.search input::placeholder{color:var(--muted);opacity:1}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:16px}
.opt[aria-pressed=true]{background:var(--raised);border-color:var(--accent)}
.opt svg{color:var(--accent)}

/* picker rows */
.xlist{display:flex;flex-direction:column;gap:6px}
.xrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.xrow[aria-pressed=true]{background:var(--raised);border-color:var(--accent)}
.xname{font-weight:600;font-size:17px}
.xsub{font-size:14px;color:var(--muted)}
.box{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line-strong);background:var(--raised);color:var(--on-accent);font-weight:700;font-size:14px}
.xrow[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
.foot{display:flex;gap:10px;padding:12px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}
.foot .btn{flex:1}

/* routine editor and detail */
.item{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .n{min-width:28px;text-align:center;font:700 24px var(--display);font-variant-numeric:tabular-nums}
.stepper .iconbtn{background:var(--raised)}
.dsets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.dsets li{display:flex;gap:12px;min-height:36px;align-items:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.dsets .n{width:32px;text-align:center;font:600 20px var(--display);color:var(--muted)}
.dsets .n.kind{color:var(--accent)}

/* progress */
.hero{padding:16px 14px 12px}
.hero .big{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.hero .v{font:700 56px/1 var(--display)}
.gname.sm{font-size:22px}
.ttl.sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.hero .u{font-size:18px;color:var(--muted)}
.hero .d{margin-left:auto;font-size:15px;color:var(--muted);text-align:right}
.hero .d b{color:var(--text)}
.chart{display:block;width:100%;height:auto;margin-top:8px;touch-action:pan-y}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.readout{min-height:22px;margin-top:6px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.readout b{color:var(--text)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{padding:10px 0 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:12px 0;border-top:1px solid var(--line);text-align:right}
.tbl td.s{font-weight:600}

/* settings */
.setrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .t{font-weight:600}
.setrow .s{font-size:14px;color:var(--muted)}
.sw{flex:none;position:relative;width:52px;height:32px;padding:0;background:var(--raised);border:1px solid var(--line-strong);border-radius:999px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted)}
.sw[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked=true]::after{left:23px;background:var(--on-accent)}
.note{font-size:14px;color:var(--muted)}
textarea.dump{width:100%;min-height:160px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font:13px/1.4 ui-monospace,monospace;color:var(--text)}

/* sheets and toast */
.layer{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);border:0;padding:0}
.sheet{position:relative;width:100%;max-height:84%;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;padding:14px 16px 18px}
.sheet h2{margin:0 0 4px;font:700 22px/1.15 var(--display);text-transform:uppercase;text-wrap:balance}
.sheet .sp{margin:0 0 8px;color:var(--muted);font-size:15px}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 4px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-size:17px;font-weight:600}
.srow.danger{color:var(--danger)}
.srow.on{color:var(--accent)}
.srow .sub{margin-left:auto;color:var(--muted);font-weight:500;font-size:15px}
.srow svg{flex:none}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:30;padding:12px 14px;background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;font-weight:600;text-align:center;pointer-events:none}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .16s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}

</style>
<div id="app"><div class="screen" id="screen"></div><div id="layer"></div><div id="toastbox"></div><div id="live" class="vh" aria-live="polite"></div></div>
<script>
(function () {
'use strict';
/* ================= utilities ================= */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const LET = 'ABCDEFGH';
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function num(v) { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function parseTime(v) {
  v = String(v).trim(); if (!v) return null;
  if (v.indexOf(':') >= 0) { const p = v.split(':'); const t = (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); return t > 0 ? t : null; }
  const n = parseInt(v, 10); return n > 0 ? n : null;
}
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s); }
function fmtDur(ms) { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString('en-US'); }
const dayFmt = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const dayFmtY = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const shortFmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
const shortFmtY = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' });
function fmtDay(t) { const d = new Date(t); return (d.getFullYear() === new Date().getFullYear() ? dayFmt : dayFmtY).format(d); }
function fmtShort(t, y) { const d = new Date(t); return (y ? shortFmtY : shortFmt).format(d); }
function defaultName() { const h = new Date().getHours(); return (h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening') + ' Workout'; }
function dataAttrs(o) { return Object.keys(o || {}).map(k => 'data-' + k + '="' + esc(o[k]) + '"').join(' '); }

/* ================= icons ================= */
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  dots: '<circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>',
  bar: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',

/* ================= logger actions ================= */
function startWorkout(o) {
  if (A) { toast(A.editing ? 'Finish editing first' : 'Finish or discard your current workout first'); return; }
  A = { id: uid(), name: o.name || defaultName(), routineId: o.routineId || null, startedAt: Date.now(), groups: o.groups || [], timer: null };
  ui.open = {}; touchActive(); acquireWake();
  ui.stack = []; ui.screen = 'logger'; ui.params = {}; render();
}
function cleanSet(s) { return { w: s.w == null ? null : s.w, r: s.r == null ? null : s.r, t: s.t == null ? null : s.t, done: !!s.done, k: s.k || 'n' }; }
function finishNow() {
  const w = clone(A), editing = !!w.editing;
  delete w.editing; delete w.timer;
  w.groups = w.groups.map(g => {
    if (g.exs.length === 1) return { id: g.id, exs: [{ exId: g.exs[0].exId, sets: g.exs[0].sets.filter(s => s.done).map(cleanSet) }] };
    const keep = []; for (let i = 0; i < g.exs[0].sets.length; i++) if (g.exs.some(e => e.sets[i] && e.sets[i].done)) keep.push(i);
    return { id: g.id, exs: g.exs.map(e => ({ exId: e.exId, sets: keep.map(i => cleanSet(e.sets[i])) })) };
  }).filter(g => g.exs[0].sets.length > 0);
  w.name = (w.name || '').trim() || defaultName();
  if (!editing) w.endedAt = Date.now();
  putRecord('w', w);
  A = null; touchActive(); releaseWake();
  ui.sheet = null; ui.stack = []; ui.screen = 'detail'; ui.params = { id: w.id }; ui.tab = 'history';
  render(); toast(editing ? 'Changes saved' : 'Workout saved');
}
function afterWorkoutGone(toDetailId) {
  A = null; touchActive(); releaseWake(); ui.sheet = null; ui.stack = [];
  if (toDetailId) { ui.screen = 'detail'; ui.params = { id: toDetailId }; } else { ui.screen = null; ui.tab = 'workout'; }

}
function removeGroup(gid) { A.groups = A.groups.filter(g => g.id !== gid); ui.sheet = null; touchActive(); render(); }
function openSheet(spec) { ui.sheet = spec; render(); }
function restRows(g) {
  const cur = groupRest(g);
  return [0, 30, 45, 60, 90, 120, 150, 180, 240, 300].map(s => ({ label: s ? fmtClock(s) : 'Off', act: 'restSet', data: { g: g.id, sec: s }, checked: s === cur }));
}

Object.assign(act, {
  toggleGroup(el) { const g = findGroup(el.dataset.g); if (!g) return; ui.open[g.id] = !isOpen(g); render(); },
  toggleSet(el) {
    const g = findGroup(el.dataset.g), ei = +el.dataset.e, si = +el.dataset.s; if (!g) return;
    const e = g.exs[ei], s = e.sets[si], ex = exById(e.exId);
    if (!s.done) {
      const ph = placeholderFor(g, ei, si);
      if (ex.type === 'wr') {
        if (s.w == null && ph.w != null) s.w = ph.w;
        if (!s.r && ph.r) s.r = ph.r;
        if (s.w == null || !s.r) { toast('Enter weight and reps first'); return; }
      } else if (ex.type === 'br') {
        if (!s.r && ph.r) s.r = ph.r;
        if (!s.r) { toast('Enter reps first'); return; }
      } else {
        if (!s.t && ph.t) s.t = ph.t;
        if (!s.t) { toast('Enter a time first'); return; }
      }
      s.done = true; s.doneAt = Date.now();
      if (g.exs.every(x => x.sets[si] && x.sets[si].done)) startRest(groupRest(g));
      unlockAudio();
    } else { s.done = false; delete s.doneAt; }
    touchActive(); render();
  },
  addSet(el) { const g = findGroup(el.dataset.g); if (!g) return; g.exs.forEach(e => e.sets.push(newSet())); touchActive(); render(); },
  setMenu(el) {
    const g = findGroup(el.dataset.g), ei = +el.dataset.e, si = +el.dataset.s; if (!g) return;
    const sup = g.exs.length > 1, cur = g.exs[ei].sets[si].k || 'n';
    const rows = [];
    if (!sup) [['n', 'Normal set'], ['w', 'Warm-up'], ['d', 'Drop set'], ['f', 'Failure']].forEach(k => rows.push({ label: k[1], act: 'setKind', data: { g: g.id, e: ei, s: si, k: k[0] }, checked: cur === k[0] }));
    rows.push({ label: sup ? 'Delete round ' + (si + 1) : 'Delete set', act: 'delSet', data: { g: g.id, s: si }, danger: true });
    openSheet({ title: sup ? 'Round ' + (si + 1) : 'Set ' + (si + 1), rows: rows });
  },
  setKind(el) { const g = findGroup(el.dataset.g); g.exs[+el.dataset.e].sets[+el.dataset.s].k = el.dataset.k; ui.sheet = null; touchActive(); render(); },
  delSet(el) {
    const g = findGroup(el.dataset.g), si = +el.dataset.s; if (!g) return;
    g.exs.forEach(e => e.sets.splice(si, 1));
    if (!g.exs[0].sets.length) A.groups = A.groups.filter(x => x.id !== g.id);
    ui.sheet = null; touchActive(); render();
  },
  groupMenu(el) {
    const g = findGroup(el.dataset.g); if (!g) return;
    const i = A.groups.indexOf(g), sup = g.exs.length > 1, rows = [];
    rows.push({ label: sup ? 'Rest after each round' : 'Rest timer', sub: groupRest(g) ? fmtClock(groupRest(g)) : 'Off', act: 'restPick', data: { g: g.id } });
    rows.push({ label: sup ? 'Add exercise to superset' : 'Superset with another exercise', act: 'groupAdd', data: { g: g.id } });
    if (sup) rows.push({ label: 'Break up superset', act: 'breakSuper', data: { g: g.id } });
    if (i > 0) rows.push({ label: 'Move up', act: 'moveGroup', data: { g: g.id, d: -1 } });
    if (i < A.groups.length - 1) rows.push({ label: 'Move down', act: 'moveGroup', data: { g: g.id, d: 1 } });
    rows.push({ label: sup ? 'Remove superset' : 'Remove exercise', act: 'removeGroupAsk', data: { g: g.id }, danger: true });
    openSheet({ title: g.exs.map(e => exById(e.exId).name).join(' + '), rows: rows });
  },
  restPick(el) { const g = findGroup(el.dataset.g); openSheet({ title: 'Rest timer', text: 'Used after each set of this exercise.', rows: restRows(g) }); },
  restSet(el) {
    const g = findGroup(el.dataset.g), sec = +el.dataset.sec;
    g.exs.forEach(e => { D.settings.rest[e.exId] = sec; }); putSettings(); ui.sheet = null; render();
  },
  groupAdd(el) { ui.sheet = null; openPicker('superset', { gid: el.dataset.g }); },
  breakSuper(el) {
    const g = findGroup(el.dataset.g), i = A.groups.indexOf(g);
    const parts = g.exs.map(e => ({ id: uid(), exs: [e] }));
    A.groups.splice.apply(A.groups, [i, 1].concat(parts)); ui.sheet = null; touchActive(); render();
  },
  moveGroup(el) {
    const g = findGroup(el.dataset.g), i = A.groups.indexOf(g), j = i + (+el.dataset.d);
    if (j < 0 || j >= A.groups.length) return;
    A.groups.splice(i, 1); A.groups.splice(j, 0, g); ui.sheet = null; touchActive(); render();
  },
  removeGroupAsk(el) {

    if (!logged) { removeGroup(g.id); return; }

  },
  removeGroupNow(el) { removeGroup(el.dataset.g); },
  addExercise() { openPicker('workout'); },
  minimize() { ui.screen = null; ui.stack = []; ui.tab = 'workout'; render(); },
  finish() {

    } else if (done < total) {

    } else finishNow();
  },
  finishNow() { finishNow(); },
  discardAsk() { openSheet({ title: 'Discard workout?', text: 'Everything logged in this workout will be deleted.', rows: [{ label: 'Discard workout', act: 'discardNow', danger: true }, { label: 'Keep going', act: 'closeSheet' }] }); },
  discardNow() { afterWorkoutGone(null); },
  cancelEdit() { openSheet({ title: 'Discard changes?', rows: [{ label: 'Discard changes', act: 'cancelEditNow', danger: true }, { label: 'Keep editing', act: 'closeSheet' }] }); },
  cancelEditNow() { const id = A.id; afterWorkoutGone(id); },
  restStart() { startRest(D.settings.defaultRest); unlockAudio(); setRestBar(); },
  restAdd(el) {

  const X = t => ses.length === 1 ? (CH.L + CH.R) / 2 : CH.L + (CH.R - CH.L) * (t - t0) / (t1 - t0);
  const Y = v => CH.B - (CH.B - CH.T) * (v - y0) / (y1 - y0);

  let g = '';
  ticks.forEach(v => { g += '<line class="grid-l" x1="' + CH.L + '" x2="' + CH.R + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text x="' + (CH.L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + fmtVal(type, v) + '</text>'; });
  if (ses.length === 1) g += '<text x="' + X(t0) + '" y="182" text-anchor="middle">' + fmtShort(t0, yr) + '</text>';
  else g += '<text x="' + CH.L + '" y="182" text-anchor="start">' + fmtShort(t0, yr) + '</text><text x="' + CH.R + '" y="182" text-anchor="end">' + fmtShort(t1, yr) + '</text>';
  const pts = ui.chartPts, showAll = pts.length <= 14;

  let h = subHeader('Settings', 'back') + '<main class="scroll">';
  h += '<div class="card">' + swRow('keepAwake', 'Keep screen on during workouts', 'Stops the phone from locking while you train. Android may ignore this in battery saver mode.', s.keepAwake) +
    swRow('sound', 'Rest timer sound', 'Three beeps when rest ends.', s.sound) + swRow('vibrate', 'Rest timer vibration', 'Buzz when rest ends, if your phone allows it.', s.vibrate) +
    '<div class="setrow"><div class="grow"><div class="t">Test the alert</div><div class="s">Check sound and vibration now.</div></div><button class="btn btn-sm" data-act="testAlert">Test</button></div></div>';
  h += '<div class="sec"><h2>Default rest</h2></div><div class="chips wrap" role="group" aria-label="Default rest time">' +
    [0, 30, 45, 60, 90, 120, 150, 180, 240, 300].map(v => '<button class="chip" data-act="defRest" data-sec="' + v + '" aria-pressed="' + (s.defaultRest === v) + '">' + (v ? fmtClock(v) : 'Off') + '</button>').join('') + '</div>' +
    '<div class="note">Each exercise can have its own rest time from its menu in a workout.</div>';
  h += '<div class="sec"><h2>Backup</h2></div><div class="card">' + swRow('cloud', 'Back up to my Claude account', 'Workouts always save on this phone first. This also copies them to your account.', D.cloud) +
    '<div class="setrow"><div class="grow"><div class="t">Status</div><div class="s" id="syncstate">' + esc(syncLabel()) + '</div></div>' + (D.cloud && SY.col ? '<button class="btn btn-sm" data-act="syncNow">Back up now</button>' : '') + '</div>' +
    '<div class="setrow"><div class="grow"><div class="t">Save a backup file</div><div class="s">All workouts, routines and exercises as one file.</div></div><button class="btn btn-sm" data-act="exportData">Save</button></div>' +
    '<div class="setrow"><div class="grow"><div class="t">Restore from a backup file</div><div class="s">Adds anything newer than what is here.</div></div><button class="btn btn-sm" data-act="importPick">Choose</button></div></div>' +
    '<input type="file" id="importfile" accept=".json,application/json" hidden>';
  if (!storageOk) h += '<div class="note" role="alert" style="color:var(--danger)">This browser is not keeping data on the phone. Keep the account backup on.</div>';
  if (ui.dump) h += '<div class="field"><label class="lab" for="dump">Backup text</label><textarea id="dump" class="dump" readonly>' + esc(ui.dump) + '</textarea><button class="btn" data-act="copyDump">Copy backup</button><div class="note">Paste it into a note or email to keep it. Restore needs it saved as a .json file.</div></div>';
  h += '<div class="note">Weights are in pounds. Estimated 1-rep max uses the Epley formula, capped at 12 reps.</div>';
  return h + '</main>';
}
Object.assign(act, {
  openSettings() { go('settings'); },
  toggle(el) {
    const k = el.dataset.k;
    if (k === 'cloud') { D.cloud = !D.cloud; touchData(); if (D.cloud) pull(); }
    else { D.settings[k] = !D.settings[k]; putSettings(); if (k === 'keepAwake') acquireWake(); }
    render();
  },
  defRest(el) { D.settings.defaultRest = +el.dataset.sec; putSettings(); render(); },
  testAlert() { unlockAudio(); ringAlarm(); toast('Alert sent'); },
  syncNow() { pull(); },
  importPick() { const i = $('#importfile'); if (i) i.click(); },
  async exportData() {
    const text = exportJSON(), name = 'gym-log-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: name, data: text }); toast('Backup saved'); return; }
    } catch (e) { if (e && e.code === 'declined') return; }
    try {
      // Plain browser download: works on phones (saves to Files / Downloads).
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Backup downloaded'); return;
    } catch (e) { }
    ui.dump = text; render();
  },
  copyDump() {
    const t = $('#dump');
    const ok = () => toast('Copied');
    const fb = () => { t.focus(); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Select the text and copy it'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok, fb); else fb();
  }
});
function importFile(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const n = importJSON(String(r.result)); toast(n ? 'Restored ' + n + ' item' + (n > 1 ? 's' : '') : 'Nothing newer in that file'); render(); } catch (e) { toast(e && e.message ? e.message : 'Could not read that file'); } inp.value = ''; };
  r.onerror = () => toast('Could not read that file');
  r.readAsText(f);
}

/* ================= navigation, rendering, events ================= */
function go(name, params) { ui.stack.push({ screen: ui.screen, params: ui.params }); ui.screen = name; ui.params = params || {}; ui.sheet = null; render(); }
Object.assign(act, {
  back() { const p = ui.stack.pop(); ui.screen = p ? p.screen : null; ui.params = p ? p.params : {}; ui.sheet = null; render(); },
  closeSheet() { ui.sheet = null; render(); }
});
let toastT = 0, hadSheet = false;
function toast(msg) {
  const b = $('#toastbox'); if (!b) return;
  b.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toastT); toastT = setTimeout(() => { b.innerHTML = ''; }, 2600);
}
function screenHTML() {
  if (ui.screen === 'logger' && !A) ui.screen = null;
  switch (ui.screen) {
    case 'logger': return loggerHTML();
    case 'picker': return pickerHTML();
    case 'newex': return newexHTML();
    case 'routine': return routineHTML();
    case 'detail': return detailHTML();
    case 'settings': return settingsHTML();
  }
  return (ui.tab === 'history' ? historyHTML() : ui.tab === 'progress' ? progressHTML() : homeHTML()) + navHTML();
}
let lastKey = '';
function render() {
  const scr = $('#screen'); if (!scr) return;
  const sc = $('.scroll', scr), st = sc ? sc.scrollTop : 0;
  const html = screenHTML(); // may reset ui.screen, so compute the key afterwards
  const key = (ui.screen || ('tab:' + ui.tab)) + (ui.screen === 'detail' ? ui.params.id : '');
  const same = key === lastKey; lastKey = key;
  scr.innerHTML = html;
  if (ui.sheet && !hadSheet) { const tb = $('#toastbox'); if (tb) tb.innerHTML = ''; } // a new sheet replaces any lingering toast
  hadSheet = !!ui.sheet;
  const layer = $('#layer'); layer.className = ui.sheet ? 'layer' : ''; layer.innerHTML = sheetHTML();
  const sc2 = $('.scroll', scr); if (sc2) sc2.scrollTop = same ? st : 0;
  if (ui.sheet) { const s = $('#sheet'); if (s) s.focus({ preventScroll: true }); }
  const ro = $('#readout'); if (ro && ui.lastPt) ro.innerHTML = readoutHTML(ui.lastPt);
}

function onInput(t) {
  const f = t.dataset.in;
  if (f === 'wname') { A.name = t.value; touchActive(); return; }
  if (f === 'pq') { ui.picker.q = t.value; refreshPicker(); return; }
  if (f === 'nxname') { ui.nx.name = t.value; return; }
  if (f === 'rname') { ui.draft.name = t.value; return; }
  const g = findGroup(t.dataset.g); if (!g) return;
  const s = g.exs[+t.dataset.e].sets[+t.dataset.s];
  if (f === 't') s.t = parseTime(t.value);
  else if (f === 'r') { const n = num(t.value); s.r = n == null ? null : Math.round(n); }
  else if (f === 'w') s.w = num(t.value);
  touchActive();
}
function onChange(t) {
  if (t.dataset.in === 't') { const g = findGroup(t.dataset.g); if (!g) return; const s = g.exs[+t.dataset.e].sets[+t.dataset.s]; t.value = s.t ? fmtClock(s.t) : ''; }
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = act[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.in) onInput(t); });
document.addEventListener('change', e => { const t = e.target; if (t.id === 'importfile') importFile(t); else if (t.dataset && t.dataset.in) onChange(t); });
document.addEventListener('focusin', e => { const t = e.target; if (t.classList && t.classList.contains('num')) { try { t.select(); } catch (x) { } } });
document.addEventListener('pointerdown', e => { unlockAudio(); if (e.target.closest && e.target.closest('#chart')) chartMove(e); }, { passive: true });
document.addEventListener('pointermove', e => { if (e.target.closest && e.target.closest('#chart') && (e.pressure > 0 || e.pointerType === 'mouse')) chartMove(e); }, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });

function boot() {
  loadLocal();
  if (A && !Array.isArray(A.groups)) A = null;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if (A) ui.screen = 'logger';
  render();
  setInterval(tick, 1000);
  if (A) acquireWake();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { persistNow(); return; }
    if (A) acquireWake();
    tick();
    if (SY.col && D.cloud) { if (Date.now() - (SY.lastAt || 0) > 300000) pull(); else flush(); }
  });
  addEventListener('online', () => { flush(); });
  addEventListener('pagehide', persistNow);
  syncInit();
}
try { boot(); } catch (err) {
  const s = document.getElementById('screen');
  if (s) s.innerHTML = '<main class="scroll"><div class="empty"><strong>Something went wrong</strong>' + esc(err && err.message) + '</div></main>';
}

})();
</script>

</body></html>
